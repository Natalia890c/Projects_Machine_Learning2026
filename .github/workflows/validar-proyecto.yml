
name: Ejecutar Semana 1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-semana-1-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install nbconvert ipykernel pyarrow openpyxl

      - name: Preparar carpetas de resultados
        run: |
          mkdir -p src/sincronicas/datos src/sincronicas/reportes

      - name: Ejecutar Semana_1SINC.ipynb
        working-directory: src/sincronicas
        run: |
          ../../.venv/bin/jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            Semana_1SINC.ipynb

      - name: Ejecutar Semana_2SINC.ipynb
        working-directory: src/sincronicas
        run: |
          ../../.venv/bin/jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            Semana_2SINC.ipynb

      - name: Verificar archivos generados
        run: |
          echo "=== Archivos TXT ==="
          find src/sincronicas -type f -name "*.txt" -print

          echo "=== Datos y reportes ==="
          find src/sincronicas/datos src/sincronicas/reportes \
            -type f -print

          TXT_COUNT=$(find src/sincronicas -type f -name "*.txt" | wc -l)

          if [ "$TXT_COUNT" -eq 0 ]; then
            echo "::error::No se generaron archivos TXT. Revisa el código de los notebooks y sus rutas de salida."
            exit 1
          fi

          echo "Se encontraron $TXT_COUNT archivos TXT."

      - name: Configurar identidad del bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Guardar todos los resultados
        run: |
          git add -A -- src/sincronicas/

          if git diff --cached --quiet; then
            echo "Los archivos generados no presentan cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados [skip ci]"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
