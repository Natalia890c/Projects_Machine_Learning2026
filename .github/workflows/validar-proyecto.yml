
name: Validación del proyecto EA1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-ea1-main
  cancel-in-progress: false

jobs:
  validar:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbconvert ipykernel

      - name: Verificar importaciones
        run: |
          PYTHONPATH=src python -c "from clases.hf_loader import HFDatasetLoader; from clases.reportes import Reportes; print('Clases importadas correctamente')"

      - name: Preparar carpetas de resultados
        run: |
          mkdir -p Sincronizar/datos Sincronizar/reportes

      - name: Ejecutar notebook EA1
        working-directory: Sincronizar
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --output /tmp/EA1_Carga_de_Datos_ejecutado.ipynb \
            --ExecutePreprocessor.timeout=1800 \
            EA1_Carga_de_Datos.ipynb

      - name: Configurar identidad del bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Guardar resultados automáticamente
        run: |
          git add Sincronizar/datos/ Sincronizar/reportes/

          if git diff --cached --quiet; then
            echo "No hay resultados nuevos para guardar."
            exit 0
          fi

          git commit -m "chore: actualizar resultados [skip ci]"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
