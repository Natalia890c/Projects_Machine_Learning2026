
name: Ejecutar EA1 - Carga de Datos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ejecutar-ea1-main
  cancel-in-progress: false

jobs:
  ejecutar-notebook:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbconvert ipykernel

      - name: Verificar clases del proyecto
        run: |
          PYTHONPATH=src python -c "from clases.hf_loader import HFDatasetLoader; from clases.reportes import Reportes; print('Clases importadas correctamente')"

      - name: Preparar carpetas de resultados
        run: |
          mkdir -p Sincronizar/datos Sincronizar/reportes

      - name: Ejecutar notebook EA1
        working-directory: Sincronizar
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute \
            --output /tmp/EA1_Carga_de_Datos_ejecutado.ipynb \
            --ExecutePreprocessor.timeout=1800 \
            EA1_Carga_de_Datos.ipynb

      - name: Buscar reportes generados
        run: |
          echo "Archivos TXT:"
          find Sincronizar -type f -name "*.txt" -print

          echo "Archivos de datos y reportes:"
          find Sincronizar/datos Sincronizar/reportes -type f -print

      - name: Configurar identidad del bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Guardar resultados en GitHub
        run: |
          git add -A -- Sincronizar/datos/ Sincronizar/reportes/

          if git diff --cached --quiet; then
            echo "No hay resultados nuevos para guardar."
            exit 0
          fi

          git commit -m "chore: actualizar resultados EA1 [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
